<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">João Vitor Reimberg — Full Stack Developer</title>
  <desc id="desc">Full Stack Developer building web applications, APIs, automation and cloud-ready software.</desc>
  <defs>
