    <radialGradient id="violetGlow" cx="78%" cy="30%" r="65%"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.24"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
