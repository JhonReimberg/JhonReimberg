<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">João Vitor Reimberg — Full Stack Developer</title>
  <desc id="desc">Full Stack Developer focused on React, TypeScript, Node.js, PHP, Laravel and PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#111936"/><stop offset="1" stop-color="#21143d"/><animate attributeName="x1" values="0;0.2;0" dur="12s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset="0.35" stop-color="#a78bfa"/><stop offset="0.7" stop-color="#38bdf8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a78bfa" opacity="0.16"/></pattern>
  </defs>
  <rect x="10" y="10" width="1180" height="400" rx="24" fill="url(#bg)" stroke="#27345f" stroke-width="2"/><rect x="10" y="10" width="1180" height="400" rx="24" fill="url(#dots)"/>
  <text x="68" y="72" fill="#a78bfa" font-family="monospace" font-size="14" letter-spacing="4">JHONREIMBERG · PIRACICABA, BRAZIL · UTC−3</text>
  <text x="68" y="155" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">João Vitor Reimberg</text>
  <text x="70" y="198" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif" font-size="25">Full Stack Developer</text>
  <text x="70" y="236" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="17">Web applications · APIs · automation · desktop software</text>
  <path d="M70 292 H1130" stroke="#29355f" stroke-width="2"/><path d="M70 292 H1130" stroke="url(#line)" stroke-width="5" filter="url(#glow)" stroke-dasharray="120 1060"><animate attributeName="stroke-dashoffset" from="1180" to="0" dur="5s" repeatCount="indefinite"/></path>
  <g font-family="monospace" font-size="16" fill="#e2e8f0"><text x="70" y="350">React</text><text x="190" y="350">TypeScript</text><text x="370" y="350">Node.js</text><text x="500" y="350">PHP / Laravel</text><text x="720" y="350">PostgreSQL</text><text x="900" y="350">Electron</text></g>
  <g fill="#a78bfa"><circle cx="158" cy="344" r="4"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle><circle cx="338" cy="344" r="4"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="468" cy="344" r="4"><animate attributeName="r" values="3;7;3" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="688" cy="344" r="4"><animate attributeName="r" values="3;7;3" dur="2.7s" repeatCount="indefinite"/></circle><circle cx="868" cy="344" r="4"><animate attributeName="r" values="3;7;3" dur="2.1s" repeatCount="indefinite"/></circle></g>
  <text x="68" y="386" fill="#64748b" font-family="monospace" font-size="13" letter-spacing="2">BUILDING PRACTICAL SOFTWARE FOR REAL WORKFLOWS</text>
</svg>
